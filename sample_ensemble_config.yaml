  # # Example 3: Instrumental Ensemble preset
  # - name: "instrumental_preset_ensemble"
  #   type: "separate"
  #   input_dir: "MIX"
  #   output_dir: "instrumental"
  #   models:
  #     - name: "InstrumentalCleanPreset"
  #       ensemble_preset: "instrumental_clean"
  #       output_names:
  #         Instrumental: "Instrumental"

  # Example 4: Post-separation Ensemble Stage combining previously separated "(Vocals)" stems
  - name: "post_separation_vocals_ensemble"
    type: "ensemble"
    mode: "vocals"
    # Choose from Ensembler algorithms (e.g. avg_fft, median_fft, max_fft, avg_wave, etc.)
    combine: "avg_fft"
    # Directory where the input vocal files are located
    input_dir: "vocals"
    # Pattern to filter for target vocal stems
    filename_filter: "(Vocals)"
    # Target output folder and output name
    output_dir: "vocals_final"
    output_name: "Ensembled_Vocals.wav"
    # Optional: limit ensembling to the top k candidates (or omit to use all)
    top_k: 2

